<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CHL — Planning hebdomadaire</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0a0d14;
  --surface:  #111520;
  --surface2: #0d1118;
  --border:   #1e2436;
  --bhi:      #2e3a5a;
  --accent:   #2563eb;
  --alo:      #1a3566;
  --green:    #16a34a;
  --glo:      #0f2e1f;
  --red:      #dc2626;
  --rlo:      #2d1515;
  --amber:    #d97706;
  --amlo:     #2d1f0a;
  --text:     #e2e8f0;
  --muted:    #64748b;
  --mono:     'DM Mono', monospace;
  --display:  'Syne', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.45;min-height:100vh}

header{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--border);
  background:rgba(10,13,20,.94);backdrop-filter:blur(12px);
  padding:0 28px;height:58px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted)}

.controls{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 28px;border-bottom:1px solid var(--border);
  background:var(--surface);
}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:300px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
#search{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 12px 8px 32px}
#search:focus{outline:none;border-color:var(--accent)}

.filter-tabs{display:flex;gap:4px}
.ftab{padding:7px 14px;border-radius:6px;font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all .15s}
.ftab:hover{border-color:var(--bhi);color:var(--text)}
.ftab.active{background:var(--accent);border-color:var(--accent);color:#fff}

.week-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.wnav-btn{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;transition:all .15s;gap:4px}
.wnav-btn:hover{border-color:var(--accent);color:var(--accent)}
.wnav-btn.today{border-color:var(--green);color:var(--green)}
.week-label{font-size:13px;color:var(--text);min-width:200px;text-align:center;font-weight:500}

main{padding:20px 28px;max-width:1600px;margin:0 auto}

.legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:50%}
.leg-dot.absent{background:var(--red)}
.leg-dot.dispo{background:var(--green)}

/* ─── Weekly calendar grid ─── */
.calendar{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;
}
.cal-head{
  display:grid;grid-template-columns:72px repeat(7,1fr);
  border-bottom:1px solid var(--border);background:var(--surface2);
}
.cal-head .corner{border-right:1px solid var(--border)}
.cal-head .day{
  padding:14px 8px;text-align:center;border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:2px;
}
.cal-head .day:last-child{border-right:none}
.cal-head .day .dname{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:500}
.cal-head .day .dnum{font-family:var(--display);font-size:22px;font-weight:800;color:var(--text)}
.cal-head .day.today .dnum{color:var(--accent)}
.cal-head .day.today{background:var(--alo)}

/* All-day absences strip */
.cal-allday{
  display:grid;grid-template-columns:72px repeat(7,1fr);
  border-bottom:1px solid var(--border);background:var(--surface2);
  min-height:40px;
}
.cal-allday .ad-label{
  font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  padding:8px 6px;border-right:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.cal-allday .ad-cell{
  border-right:1px solid var(--border);padding:4px;
  display:flex;flex-direction:column;gap:3px;min-height:36px;
}
.cal-allday .ad-cell:last-child{border-right:none}
.allday-chip{
  background:var(--rlo);border-left:3px solid var(--red);
  padding:5px 8px;border-radius:5px;font-size:12px;font-weight:500;color:#fecaca;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative;
  transition:background .15s, transform .15s;
}
.allday-chip:hover{background:#4a1f1f;transform:translateX(2px)}

/* Hour grid */
.cal-body{
  display:grid;grid-template-columns:72px repeat(7,1fr);
  position:relative;
}
.hour-col{border-right:1px solid var(--border);background:var(--surface2)}

.hour-label{
  height:64px;font-size:10px;color:var(--muted);
  padding:2px 6px;text-align:right;border-bottom:1px solid var(--border);
}
.day-col{border-right:1px solid var(--border);position:relative}
.day-col:last-child{border-right:none}
.day-col.today{background:rgba(37,99,235,.04)}
.hour-cell{height:64px;border-bottom:1px solid var(--border)}

/* Event blocks */
.event{
  position:absolute;left:4px;right:4px;
  background:var(--glo);border-left:3px solid var(--green);
  border-radius:6px;padding:6px 8px;font-size:12px;color:#bbf7d0;
  overflow:hidden;cursor:pointer;
  transition:filter .15s, transform .15s, box-shadow .15s;
}
.event:hover{filter:brightness(1.35);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.45);z-index:10}
.event .ev-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dcfce7;font-size:12.5px;letter-spacing:.2px}
.event .ev-time{font-size:11px;color:#86efac;opacity:.95;margin-top:2px}

/* Tooltip */
.tooltip{display:none}
#floating-tooltip{
  position:fixed;z-index:1000;pointer-events:none;
  background:#1a1f30;border:1px solid var(--bhi);border-radius:10px;
  padding:12px 14px;min-width:240px;max-width:320px;
  font-size:12.5px;line-height:1.65;color:var(--text);
  box-shadow:0 12px 32px rgba(0,0,0,.6);
  opacity:0;transform:translateY(-4px);transition:opacity .12s, transform .12s;
}
#floating-tooltip.show{opacity:1;transform:translateY(0)}
#floating-tooltip .t-label{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
#floating-tooltip .t-val{margin-bottom:8px;color:var(--text)}
#floating-tooltip .t-val:last-child{margin-bottom:0}
#floating-tooltip strong{color:#fff;font-weight:600}

/* Loading / Empty */
.loading{text-align:center;padding:60px;color:var(--muted)}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media (max-width:900px){
  .cal-head,.cal-allday,.cal-body{grid-template-columns:44px repeat(7,1fr)}
  .cal-head .day .dname{font-size:9px}
  .cal-head .day .dnum{font-size:14px}
  .hour-label{font-size:9px}
  .event{font-size:10px;padding:2px 4px}
}
</style>
</head>
<body>

<header>
  <div class="logo">CHL <span>Planning</span></div>
  <div class="header-right">
    <span id="last-update">—</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Rechercher…"/>
  </div>

  <div class="filter-tabs">
    <button class="ftab active" data-filter="all">Tout</button>
    <button class="ftab" data-filter="absences">📋 Absences</button>
    <button class="ftab" data-filter="dispos">🕐 Dispos</button>
  </div>

  <div class="week-nav">
    <button class="wnav-btn" id="prev-week" title="Semaine précédente">‹</button>
    <button class="wnav-btn today" id="today-btn">Aujourd'hui</button>
    <button class="wnav-btn" id="next-week" title="Semaine suivante">›</button>
    <div class="week-label" id="week-label">—</div>
  </div>
</div>

<main>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot absent"></div>Absence</div>
    <div class="leg-item"><div class="leg-dot dispo"></div>Disponible</div>
    <div class="leg-item" style="margin-left:auto">Heures affichées : <strong style="color:var(--text);margin-left:4px" id="hour-range">08h → 24h</strong></div>
  </div>

  <div id="content">
    <div class="loading"><div class="spinner"></div>Chargement du planning…</div>
  </div>
</main>

<script>
// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
const API      = "https://chl-bot-gestion-1.onrender.com";
const GUILD_ID = "1384283719933628416";

const DAYS_FR    = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DAYS_SHORT = ["LUN","MAR","MER","JEU","VEN","SAM","DIM"];
const MONTHS_FR  = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

// Calendar window
const HOUR_START = 8;
const HOUR_END   = 24; // exclusive => slots 8..23
const SLOT_H     = 64; // px per hour

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let allData      = { absences: [], disponibilites: [] };
let weekStart    = startOfWeek(new Date()); // Monday
let activeFilter = "all";
let searchQuery  = "";

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function startOfWeek(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = (d.getDay() + 6) % 7; // Mon=0..Sun=6
  d.setDate(d.getDate() - day);
  return d;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDay(d){ return `${d.getDate()} ${MONTHS_FR[d.getMonth()]}`; }
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function parseYMD(s){ const [y,m,da] = s.split("-").map(Number); return new Date(y, m-1, da); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function esc(str){ if(!str) return ""; return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function matchSearch(item){
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return [item.nom,item.prenom,item.discord_tag].filter(Boolean).join(" ").toLowerCase().includes(q);
}

// Parse horaires text into [{dayIdx, startH, endH, raw}]
// Supports formats like:
//   "Lundi 18h-22h"
//   "Mar: 20:00-23:30"
//   "Mercredi 18h30 - 22h"
//   "Lun-Ven 19h-23h"
const DAY_ALIASES = {
  "lundi":0,"lun":0,"lu":0,
  "mardi":1,"mar":1,"ma":1,
  "mercredi":2,"mer":2,"me":2,
  "jeudi":3,"jeu":3,"je":3,
  "vendredi":4,"ven":4,"ve":4,
  "samedi":5,"sam":5,"sa":5,
  "dimanche":6,"dim":6,"di":6,
};
function parseHourToken(tok){
  // "18h", "18h30", "18:30", "18"
  const m = tok.match(/^(\d{1,2})\s*[h:]?\s*(\d{2})?$/);
  if(!m) return null;
  const h = parseInt(m[1],10);
  const mn = m[2] ? parseInt(m[2],10) : 0;
  if(h<0||h>24||mn<0||mn>59) return null;
  return h + mn/60;
}
function parseHoraires(text){
  if(!text) return [];
  const blocks = [];
  const lines = text.split(/[\n;]+/);
  for(const lineRaw of lines){
    const line = lineRaw.trim();
    if(!line) continue;

    // Range of days "Lun-Ven 19h-23h"
    const rangeMatch = line.match(/^([a-zéû]+)\s*[-–]\s*([a-zéû]+)\s+(.+)$/i);
    let dayIdxs = [];
    let timePart = "";

    if(rangeMatch){
      const a = DAY_ALIASES[rangeMatch[1].toLowerCase()];
      const b = DAY_ALIASES[rangeMatch[2].toLowerCase()];
      if(a!=null && b!=null){
        for(let i=a;i<=b;i++) dayIdxs.push(i);
        timePart = rangeMatch[3];
      }
    }
    if(dayIdxs.length===0){
      // Single day
      const sm = line.match(/^([a-zéû]+)[\s:.,-]+(.+)$/i);
      if(sm){
        const di = DAY_ALIASES[sm[1].toLowerCase()];
        if(di!=null){ dayIdxs=[di]; timePart=sm[2]; }
      }
    }
    if(dayIdxs.length===0) continue;

    // Find time range(s) in timePart: "18h-22h" or "18:00-22:00", may have multiple
    const timeRegex = /(\d{1,2}(?:[h:]\d{2})?h?)\s*[-–à]\s*(\d{1,2}(?:[h:]\d{2})?h?)/gi;
    let tm;
    while((tm = timeRegex.exec(timePart)) !== null){
      const s = parseHourToken(tm[1].replace(/h$/,""));
      const e = parseHourToken(tm[2].replace(/h$/,""));
      if(s==null||e==null) continue;
      const endH = e<=s ? 24 : e; // assume same day; treat 0 as 24 if after start
      dayIdxs.forEach(d => blocks.push({ dayIdx:d, startH:s, endH, raw:line }));
    }
  }
  return blocks;
}

// ══════════════════════════════════════════════
//  LOAD DATA
// ══════════════════════════════════════════════
async function loadData(){
  try{
    const res  = await fetch(`${API}/api/planning?guildId=${GUILD_ID}`);
    const data = await res.json();
    if(!data.success) throw new Error(data.error);
    allData = data;
    document.getElementById("last-update").textContent = `Mis à jour : ${new Date().toLocaleTimeString("fr-FR")}`;
    render();
  }catch(err){
    document.getElementById("content").innerHTML =
      `<div class="empty">⚠️ Erreur de chargement : ${esc(err.message)}</div>`;
  }
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function render(){
  const weekEnd = addDays(weekStart, 6);
  document.getElementById("week-label").textContent =
    `${fmtDay(weekStart)} – ${fmtDay(weekEnd)} ${weekEnd.getFullYear()}`;
  document.getElementById("hour-range").textContent =
    `${String(HOUR_START).padStart(2,"0")}h → ${String(HOUR_END).padStart(2,"0")}h`;

  const today = new Date();
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(weekStart, i));

  // Filter absences for this week
  const weekAbsences = allData.absences.filter(a => {
    const deb = parseYMD(a.date_debut);
    const fin = parseYMD(a.date_fin);
    return deb <= weekEnd && fin >= weekStart && matchSearch(a);
  });

  // Filter dispos active this week
  const weekDispos = allData.disponibilites.filter(d => {
    const from  = parseYMD(d.valid_from);
    const until = parseYMD(d.valid_until);
    return from <= weekEnd && until >= weekStart && matchSearch(d);
  });

  // Build calendar
  const cal = document.createElement("div");
  cal.className = "calendar";

  // ── Header row ──
  const head = document.createElement("div");
  head.className = "cal-head";
  head.innerHTML = `<div class="corner"></div>`;
  days.forEach((d,i) => {
    const isToday = sameDay(d, today);
    head.innerHTML += `
      <div class="day${isToday?' today':''}">
        <div class="dname">${DAYS_SHORT[i]}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>`;
  });
  cal.appendChild(head);

  // ── All-day strip (absences) ──
  if(activeFilter !== "dispos"){
    const allday = document.createElement("div");
    allday.className = "cal-allday";
    allday.innerHTML = `<div class="ad-label">Absences</div>`;
    days.forEach(day => {
      const cell = document.createElement("div");
      cell.className = "ad-cell";
      weekAbsences.forEach(a => {
        const deb = parseYMD(a.date_debut);
        const fin = parseYMD(a.date_fin);
        if(day >= deb && day <= fin){
          const debStr = a.date_debut.split("-").reverse().join("/");
          const finStr = a.date_fin.split("-").reverse().join("/");
          const chip = document.createElement("div");
          chip.className = "allday-chip";
          chip.innerHTML = `
            ${esc(a.prenom)} ${esc(a.nom)}
            <div class="tooltip">
              <div class="t-label">Absence</div>
              <div class="t-val"><strong>${esc(a.prenom)} ${esc(a.nom)}</strong></div>
              <div class="t-val">📅 Du ${debStr} au ${finStr}</div>
              <div class="t-val">🎮 ${esc(a.discord_tag || "—")}</div>
              <div class="t-label" style="margin-top:6px">Raison</div>
              <div class="t-val">${esc(a.raison || "Non renseignée")}</div>
            </div>`;
          cell.appendChild(chip);
        }
      });
      allday.appendChild(cell);
    });
    cal.appendChild(allday);
  }

  // ── Hour grid (dispos) ──
  const body = document.createElement("div");
  body.className = "cal-body";

  // Hour column
  const hourCol = document.createElement("div");
  hourCol.className = "hour-col";
  for(let h=HOUR_START; h<HOUR_END; h++){
    const lbl = document.createElement("div");
    lbl.className = "hour-label";
    lbl.textContent = `${String(h).padStart(2,"0")}h`;
    hourCol.appendChild(lbl);
  }
  body.appendChild(hourCol);

  // Day columns
  days.forEach((day, dayIdx) => {
    const col = document.createElement("div");
    col.className = "day-col" + (sameDay(day,today) ? " today" : "");
    for(let h=HOUR_START; h<HOUR_END; h++){
      const cell = document.createElement("div");
      cell.className = "hour-cell";
      col.appendChild(cell);
    }

    // Place dispo blocks for this weekday
    if(activeFilter !== "absences"){
      weekDispos.forEach(d => {
        const from  = parseYMD(d.valid_from);
        const until = parseYMD(d.valid_until);
        if(day < from || day > until) return;

        const blocks = parseHoraires(d.horaires);
        blocks.filter(b => b.dayIdx === dayIdx).forEach(b => {
          const startH = Math.max(b.startH, HOUR_START);
          const endH   = Math.min(b.endH, HOUR_END);
          if(endH <= startH) return;
          const top    = (startH - HOUR_START) * SLOT_H;
          const height = (endH - startH) * SLOT_H;

          const fmtH = h => {
            const hh = Math.floor(h);
            const mm = Math.round((h-hh)*60);
            return mm===0 ? `${hh}h` : `${hh}h${String(mm).padStart(2,"0")}`;
          };

          const ev = document.createElement("div");
          ev.className = "event";
          ev.style.top    = top + "px";
          ev.style.height = (height - 2) + "px";
          ev.innerHTML = `
            <div class="ev-name">${esc(d.prenom)} ${esc(d.nom)}</div>
            <div class="ev-time">${fmtH(b.startH)} – ${fmtH(b.endH)}</div>
            <div class="tooltip">
              <div class="t-label">Disponibilité</div>
              <div class="t-val"><strong>${esc(d.prenom)} ${esc(d.nom)}</strong></div>
              <div class="t-val">🎮 ${esc(d.discord_tag || "—")}</div>
              <div class="t-val">🕐 ${fmtH(b.startH)} – ${fmtH(b.endH)}</div>
              <div class="t-label" style="margin-top:6px">Période</div>
              <div class="t-val">${d.valid_from.split("-").reverse().join("/")} → ${d.valid_until.split("-").reverse().join("/")}</div>
              <div class="t-label" style="margin-top:6px">Horaires bruts</div>
              <div class="t-val" style="white-space:pre-wrap">${esc(d.horaires||"—")}</div>
            </div>`;
          col.appendChild(ev);
        });
      });
    }

    body.appendChild(col);
  });

  cal.appendChild(body);

  const content = document.getElementById("content");
  content.innerHTML = "";
  content.appendChild(cal);

  // Footer stats
  const stats = document.createElement("div");
  stats.style.cssText = "margin-top:14px;display:flex;gap:18px;color:var(--muted);font-size:12px;flex-wrap:wrap";
  stats.innerHTML = `
    <span>📋 ${weekAbsences.length} absence${weekAbsences.length>1?"s":""}</span>
    <span>🕐 ${weekDispos.length} disponibilité${weekDispos.length>1?"s":""}</span>
  `;
  content.appendChild(stats);
}

// ══════════════════════════════════════════════
//  EVENTS

<div id="floating-tooltip" role="tooltip"></div>
<script>
(function(){
  const tip = document.getElementById('floating-tooltip');
  let activeEl = null;
  function show(e){
    const target = e.target.closest('.event, .allday-chip');
    if(!target || target === activeEl) return;
    const inner = target.querySelector('.tooltip');
    if(!inner) return;
    activeEl = target;
    tip.innerHTML = inner.innerHTML;
    tip.classList.add('show');
    position(e);
  }
  function position(e){
    const pad = 14;
    const r = tip.getBoundingClientRect();
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if(x + r.width  > window.innerWidth  - 8) x = e.clientX - r.width  - pad;
    if(y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = Math.max(8,x) + 'px';
    tip.style.top  = Math.max(8,y) + 'px';
  }
  function hide(e){
    if(activeEl && !e.target.closest('.event, .allday-chip')){
      activeEl = null;
      tip.classList.remove('show');
    }
  }
  document.addEventListener('mouseover', show);
  document.addEventListener('mousemove', e => { if(activeEl) position(e); });
  document.addEventListener('mouseout', hide);
  document.addEventListener('scroll', () => { activeEl=null; tip.classList.remove('show'); }, true);
})();
</script>
</body>
